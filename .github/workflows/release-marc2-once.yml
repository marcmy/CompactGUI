name: Publish v4.0.0-beta.7-marc.2

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: CompactGUI/CompactGUI.vbproj
  RUNTIME_IDENTIFIER: win-x64
  RELEASE_TAG: v4.0.0-beta.7-marc.2
  TARGET_SHA: 593e833a011fdd0a9ea08303fc3f404af09cab55

jobs:
  release:
    name: Build and publish marc.2
    runs-on: windows-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish self-contained executable
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "compactgui-publish"
          Remove-Item $publishDir -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish $env:PROJECT_PATH `
            --configuration Release `
            --runtime $env:RUNTIME_IDENTIFIER `
            --self-contained true `
            --no-restore `
            --output $publishDir `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:TreatWarningsAsErrors=true

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release assets
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "compactgui-publish"
          $packageDir = Join-Path $env:RUNNER_TEMP "compactgui-package"
          $artifactDir = Join-Path $env:RUNNER_TEMP "compactgui-artifacts"

          Remove-Item $packageDir, $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $packageDir, $artifactDir -ItemType Directory -Force | Out-Null

          Copy-Item (Join-Path $publishDir "CompactGUI.exe") $packageDir
          Copy-Item "LICENSE" $packageDir

          @(
            "Repository: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
            "Commit: $env:TARGET_SHA"
            "Release: $env:RELEASE_TAG"
            "Runtime: $env:RUNTIME_IDENTIFIER"
          ) | Set-Content (Join-Path $packageDir "BUILD-INFO.txt") -Encoding utf8

          $zipPath = Join-Path $artifactDir "CompactGUI-win-x64.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          Copy-Item (Join-Path $publishDir "CompactGUI.exe") (Join-Path $artifactDir "CompactGUI.exe")

          Get-ChildItem $artifactDir -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } | Set-Content (Join-Path $artifactDir "SHA256SUMS.txt") -Encoding ascii

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "compactgui-artifacts"

          gh release create $env:RELEASE_TAG `
            "$artifactDir/CompactGUI-win-x64.zip" `
            "$artifactDir/CompactGUI.exe" `
            "$artifactDir/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --title "CompactGUI $env:RELEASE_TAG" `
            --generate-notes `
            --target $env:TARGET_SHA `
            --prerelease

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
