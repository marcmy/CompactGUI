name: One-shot upstream merge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream while preserving fork conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/IridiumIO/CompactGUI.git
          git fetch --prune upstream master
          git switch --force-create sync/upstream-master origin/master

          set +e
          git merge --no-commit --no-ff -X ours upstream/master
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicted < <(git diff --name-only --diff-filter=U)
            for file in "${conflicted[@]}"; do
              if git cat-file -e ":2:$file" 2>/dev/null; then
                git checkout --ours -- "$file"
                git add -- "$file"
              else
                git rm -f -- "$file"
              fi
            done
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git add -A
          git commit -m "Merge upstream CompactGUI master (preserve fork conflicts)"
          git push --force origin HEAD:refs/heads/sync/upstream-master
