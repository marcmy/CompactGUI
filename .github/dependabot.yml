version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/CompactGUI"
      - "/CompactGUI.Core"
      - "/CompactGUI.Logging"
      - "/CompactGUI.Watcher"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
